[project]
name = "shared-core"
version = "0.1.0"
description = "Shared models, schemas, constants, and DB helpers for FIRMS services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "sqlmodel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_core"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["shared_core"]
reportMissingTypeStubs = false
