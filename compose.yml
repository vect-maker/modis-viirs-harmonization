services:
  db:
    image: docker.io/postgis/postgis:17-3.5
    container_name: firms-postgis
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-firms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-firms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: apps/frontend
      dockerfile: prod.containerfile
    image: localhost/firms-frontend:prod
    container_name: firms-frontend
    restart: unless-stopped

  backend:
    build:
      context: apps/backend
      dockerfile: prod.containerfile
    image: localhost/firms-backend:prod
    container_name: firms-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/firms}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: docker.io/library/caddy:2.9-alpine
    container_name: firms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    name: firms_pgdata
  caddy_data:
    name: firms_caddy_data
  caddy_config:
    name: firms_caddy_config
