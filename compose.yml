services:
  db:
    image: docker.io/postgis/postgis:17-3.5
    container_name: firms-postgis
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-firms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-firms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: apps/frontend
      dockerfile: prod.containerfile
    image: localhost/firms-frontend:prod
    container_name: firms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  pgdata:
    name: firms_pgdata
