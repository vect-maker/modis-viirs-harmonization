[project]
name = "firms-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "shared-core",
    "geojson-pydantic>=2.0.0",
    "httpx",
    "nats-py>=2.9.0",
    "numpy",
    "pytest",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "shapely>=2.0.0",
    "sqlmodel",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "ruff",
    "basedpyright",
    "psycopg[binary]>=3.3.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv"]
reportMissingTypeStubs = false

[tool.uv.sources]
shared-core = { path = "../../shared", editable = true }
