services:
  frontend:
    build:
      context: apps/frontend
      dockerfile: debug.containerfile
    image: localhost/firms-frontend:debug
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - ./apps/frontend:/app:Z

  backend:
    build:
      context: apps/backend
      dockerfile: debug.containerfile
    image: localhost/firms-backend:debug
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-firms}
    volumes:
      - ./apps/backend:/app:Z
      - backend_venv:/opt/venv

  caddy:
    ports: !override
      - "8080:80"
      - "8443:443"
    volumes: !override
      - ./debug.Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_venv:
    name: firms_backend_venv
