services:
  frontend:
    build:
      context: apps/frontend
      dockerfile: debug.containerfile
    image: localhost/firms-frontend:debug
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 8080"]
    volumes:
      - ./apps/frontend:/app:Z
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: .
      dockerfile: apps/backend/debug.containerfile
    image: localhost/firms-backend:debug
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-firms}
      NATS_URL: ${CONTAINER_NATS_URL:-nats://nats:4222}
      SSE_PRESENCE_TTL_SECONDS: ${SSE_PRESENCE_TTL_SECONDS:-45}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/etc/keys/auth-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/etc/keys/auth-public.pem}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-access_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
    volumes:
      - ./apps/backend:/workspace/apps/backend:Z
      - ./apps/backend/keys:/etc/keys:ro,z
      - ./shared:/workspace/shared:z
      - backend_venv:/opt/venv

  worker:
    build:
      context: .
      dockerfile: apps/worker/debug.containerfile
    image: localhost/firms-worker:debug
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-firms}
      NATS_URL: ${CONTAINER_NATS_URL:-nats://nats:4222}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      FIRMS_AREA_BBOX: ${FIRMS_AREA_BBOX:--92.3,7.2,-77.1,18.5}
      FIRMS_COUNTRY_NAME: ${FIRMS_COUNTRY_NAME:-Central_America}
      CATCHUP_COOLDOWN_SECONDS: ${CATCHUP_COOLDOWN_SECONDS:-610}
      NRT_POLL_INTERVAL_SECONDS: ${NRT_POLL_INTERVAL_SECONDS:-300}
    volumes:
      - ./apps/worker:/workspace/apps/worker:Z
      - ./shared:/workspace/shared:z
      - worker_venv:/opt/venv

  caddy:
    ports: !override
      - "8080:80"
      - "8443:443"
    volumes: !override
      - ./debug.Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_venv:
    name: firms_backend_venv
  worker_venv:
    name: firms_worker_venv
  frontend_node_modules:
    name: firms_frontend_node_modules
